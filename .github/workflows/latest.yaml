name: Latest

on:
  push:
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    if: github.repository == 'JrMasterModelBuilder/homebrew-megatools'

    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        run: sudo apt-get install -y tor

      - name: Check Latest
        run: ./test/latest.sh

      - name: Keep Alive
        uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !cancelled() }}
