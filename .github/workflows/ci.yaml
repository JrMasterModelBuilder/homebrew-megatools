name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        host:
          - xcode-27
          - macos-26
          - macos-15
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-22.04
          - ubuntu-22.04-arm
        name:
          - megatools-stable
          - megatools-stable-extra
          - megatools-experimental
          - megatools-experimental-extra

    name: ${{ matrix.host }} ${{ matrix.name }}

    runs-on: ${{ matrix.host }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1

      - name: Cleanup
        run: brew list --formula | grep openssl | xargs -r brew unlink
        if: ${{ startsWith(matrix.host, 'macos-') }}

      - name: Temp Dir
        run: mkdir /tmp/brewtemp

      - name: Tap Dir
        run: mkdir -p "$(brew --repo)/Library/Taps/$(dirname "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"

      - name: Tap Link
        run: ln -s "$PWD" "$(brew --repo)/Library/Taps/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"

      - name: Taps
        run: brew tap

      - name: Info
        run: brew info "${{ matrix.name }}"

      - name: Install
        run: brew install --verbose --keep-tmp "${{ matrix.name }}"
        env:
          HOMEBREW_TEMP: /tmp/brewtemp

      - name: Installed
        run: brew info "${{ matrix.name }}"

      - name: Audit
        run: brew audit --except=file,specs "${{ matrix.name }}"

      - name: Test
        run: brew test "${{ matrix.name }}"

      - name: Temp Archive
        if: always()
        run: tar -czf "$RUNNER_TEMP/brewtemp.tar.gz" -C /tmp brewtemp

      - name: Temp Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.host }} ${{ matrix.name }} brewtemp
          path: ${{ runner.temp }}/brewtemp.tar.gz
          include-hidden-files: true
